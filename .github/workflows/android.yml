name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode existing Blockline signing keystore
        env:
          BLOCKLINE_KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
        run: |
          test -n "$BLOCKLINE_KEYSTORE_BASE64" || { echo "Missing BLOCKLINE_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$BLOCKLINE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockline-release.jks"
          echo "BLOCKLINE_KEYSTORE_PATH=$RUNNER_TEMP/blockline-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          BLOCKLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          BLOCKLINE_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          BLOCKLINE_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        run: |
          test -n "$BLOCKLINE_KEYSTORE_PASSWORD" || { echo "Missing BLOCKLINE_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$BLOCKLINE_KEY_ALIAS" || { echo "Missing BLOCKLINE_KEY_ALIAS repository secret"; exit 1; }
          test -n "$BLOCKLINE_KEY_PASSWORD" || { echo "Missing BLOCKLINE_KEY_PASSWORD repository secret"; exit 1; }
          gradle assembleRelease

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/EduSim-THPT-v${GITHUB_REF_NAME#v}.apk"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            cp app/build/outputs/apk/release/app-release.apk output/EduSim-THPT-latest.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduSim-THPT-APK
          path: output/*.apk
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true

name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/EduSim-THPT-v${GITHUB_REF_NAME#v}.apk"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/EduSim-THPT-latest.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduSim-THPT-APK
          path: output/*.apk
          retention-days: 14
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true

name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing key from repository secrets
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          KEYSTORE="$RUNNER_TEMP/release-signing.jks"

          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing. Building a debug APK instead."
            exit 0
          fi

          if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The keystore secret is not valid Base64. Building a debug APK instead."
            exit 0
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The keystore, store password, or key alias from repository secrets could not be validated. Building a debug APK instead."
            exit 0
          fi

          # Test the private-key password by signing a temporary file. No secret values are printed.
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'signing validation\n' > "$RUNNER_TEMP/signing-check/check.txt"
          jar --create --file "$RUNNER_TEMP/signing-check/check.jar" -C "$RUNNER_TEMP/signing-check" check.txt
          if ! jarsigner -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -signedjar "$RUNNER_TEMP/signing-check/check-signed.jar" "$RUNNER_TEMP/signing-check/check.jar" "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The private-key password in repository secrets could not sign a test file. Check the configured key password. Building a debug APK instead."
            exit 0
          fi

          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Signing keystore, alias, store password, and private-key password validated."

      - name: Build APK
        id: build
        shell: bash
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          if [[ "$SIGNING_READY" == "true" ]]; then
            if gradle assembleRelease; then
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Release build failed. Falling back to a debug APK; inspect the Gradle log for the release error."
              gradle assembleDebug
              echo "signed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gradle assembleDebug
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK artifact
        shell: bash
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          mkdir -p output
          if [[ "$SIGNED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "output/EduSim-THPT-v${GITHUB_REF_NAME#v}.apk"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              cp app/build/outputs/apk/release/app-release.apk output/EduSim-THPT-latest.apk
            fi
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/EduSim-THPT-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduSim-THPT-APK
          path: output/*.apk
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true

name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Blockline signing key
        id: signing
        env:
          BLOCKLINE_KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
          BLOCKLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          BLOCKLINE_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          BLOCKLINE_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$BLOCKLINE_KEYSTORE_BASE64" && -n "$BLOCKLINE_KEYSTORE_PASSWORD" && -n "$BLOCKLINE_KEY_ALIAS" && -n "$BLOCKLINE_KEY_PASSWORD" ]]; then
            if ! echo "$BLOCKLINE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockline-release.jks"; then
              echo "::warning::Keystore secret is not valid Base64. A debug APK will be built instead."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            elif ! keytool -list -keystore "$RUNNER_TEMP/blockline-release.jks" -storepass "$BLOCKLINE_KEYSTORE_PASSWORD" -alias "$BLOCKLINE_KEY_ALIAS" >/dev/null 2>&1; then
              echo "::warning::Cannot open the keystore with the configured store password and alias. Check the EduSimTHPT signing secrets. A debug APK will be built instead."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "BLOCKLINE_KEYSTORE_PATH=$RUNNER_TEMP/blockline-release.jks" >> "$GITHUB_ENV"
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Blockline signing secrets are missing in EduSimTHPT. Building a debug APK instead; it will not be signed with the Blockline release key."
          fi

      - name: Build APK
        id: build
        shell: bash
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          BLOCKLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          BLOCKLINE_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          BLOCKLINE_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        run: |
          if [[ "$SIGNING_READY" == "true" ]]; then
            if gradle assembleRelease; then
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Release packaging failed, commonly because the private-key password is incorrect. Falling back to a debug APK; verify BLOCKLINE_KEY_PASSWORD in repository secrets."
              gradle assembleDebug
              echo "signed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gradle assembleDebug
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK artifact
        shell: bash
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          mkdir -p output
          if [[ "$SIGNED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "output/EduSim-THPT-v${GITHUB_REF_NAME#v}.apk"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              cp app/build/outputs/apk/release/app-release.apk output/EduSim-THPT-latest.apk
            fi
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/EduSim-THPT-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduSim-THPT-APK
          path: output/*.apk
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
